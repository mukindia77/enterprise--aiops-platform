apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: ecommerce-data
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:16
        ports:
        - containerPort: 5432
        env:
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        - name: POSTGRES_DB
          value: ecommerce
        - name: POSTGRES_USER
          value: ecommerce_user
        - name: POSTGRES_PASSWORD
          valueFrom:
             secretKeyRef:
               name: postgres-secret
               key: POSTGRES_PASSWORD
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: postgres-pvc
